<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal de Cotações{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top shadow-sm px-3">
  <a class="navbar-brand" href="/"><i class="fa-solid fa-envelope-open-text me-2 text-primary"></i>Portal de Cotações</a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-secondary small"><i class="fa fa-user me-1"></i>{{ session.user }}</span>
    <a href="/logout" class="btn btn-sm btn-outline-secondary">Sair</a>
  </div>
</nav>

<div class="wrapper">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="section-label">Menu</div>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
          <i class="fa-solid fa-chart-pie fa-fw"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if '/quotes' in request.path %}active{% endif %}" href="/quotes">
          <i class="fa-solid fa-file-invoice fa-fw"></i> Cotações
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs">
          <i class="fa-solid fa-clock-rotate-left fa-fw"></i> Histórico
        </a>
      </li>
    </ul>
  </nav>

  <!-- Content -->
  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show shadow-sm" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
