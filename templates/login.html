<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Portal de Cotações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background:#f0f2f5">
  <div class="login-card card p-4 p-md-5 w-100 mx-3">
    <div class="text-center mb-4">
      <div class="login-logo mb-2"><i class="fa-solid fa-envelope-open-text"></i></div>
      <h5 class="fw-bold mb-0">Portal de Cotações</h5>
      <small class="text-muted">Faça login para continuar</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuário</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa fa-user text-muted"></i></span>
          <input type="text" name="username" class="form-control border-start-0" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Senha</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-muted"></i></span>
          <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="fa fa-sign-in-alt me-1"></i> Entrar
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
