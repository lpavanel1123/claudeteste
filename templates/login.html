<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Portal de Cotações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background:#0d1b2a">

  <div class="login-card card p-4 p-md-5 w-100 mx-3 bg-white">
    <div class="text-center mb-4">
      <div class="login-logo-bar"></div>
      <h5 class="fw-bold mb-0" style="color:#005073">Portal de Cotações</h5>
      <small class="text-muted">Cisco-based Procurement Portal</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label small fw-semibold" style="color:#1a2335">Usuário</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa fa-user fa-sm"></i></span>
          <input type="text" name="username" class="form-control border-start-0" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold" style="color:#1a2335">Senha</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa fa-lock fa-sm"></i></span>
          <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-cisco w-100 py-2 fw-semibold">
        Entrar <i class="fa fa-arrow-right ms-1"></i>
      </button>
    </form>

    <div class="text-center mt-4">
      <div class="d-flex justify-content-center align-items-center gap-1">
        <div style="width:6px;height:6px;background:#049FD9;border-radius:50%"></div>
        <div style="width:6px;height:6px;background:#00BCEB;border-radius:50%"></div>
        <div style="width:6px;height:6px;background:#005073;border-radius:50%"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
